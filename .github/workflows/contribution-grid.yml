name: Contribution grid

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Encounter
        type: choice
        default: auto
        options: [auto, cat, cluster, empty]
  schedule:
    - cron: '23 16 * * *'

concurrency:
  group: contribution-grid
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Install FFmpeg if needed
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Build repository owner’s calendar
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTION_TOKEN || github.token }}
        run: python scripts/calendar.py
      - name: Render the README GIF
        env:
          SCENARIO: ${{ inputs.scenario || 'auto' }}
        run: node scripts/render-grid.mjs --scenario "$SCENARIO"
      - name: Update the profile GIF
        run: |
          git add output/contribution-grid.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh contribution grid'
          git push
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_GRID_PAGES == 'true'
        with:
          path: build/site

  deploy:
    if: vars.ENABLE_GRID_PAGES == 'true'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
