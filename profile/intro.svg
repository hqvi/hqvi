<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 73" width="600" height="73" role="img" aria-labelledby="title">
  <title id="title">howdy, i'm havi. larping is my hobby.</title>
  <defs>
    <clipPath id="line-one"><rect x="163" y="0" width="274" height="35"><animate attributeName="width" values="0;274" begin="0s" dur="1.25s" calcMode="linear" fill="freeze"/></rect></clipPath>
    <clipPath id="line-two"><rect x="181" y="35" width="252" height="38"><animate attributeName="width" from="0" to="252" begin="1.45s" dur="1.45s" fill="freeze"/><animate attributeName="width" from="0" to="0" begin="0s" dur="1.45s"/></rect></clipPath>
  </defs>
  <g font-family="monospace">
    <g clip-path="url(#line-one)">
      <text x="300" y="29" text-anchor="middle" fill="#82dba4" font-size="27" font-weight="700">howdy, i'm havi.</text>
    </g>
    <g clip-path="url(#line-two)">
      <text x="300" y="57" text-anchor="middle" fill="#a9b9ed" font-size="19">larping is my hobby.</text>
      <text x="415" y="57" fill="#82dba4" font-size="19">▌<animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></text>
    </g>
  </g>
</svg>
