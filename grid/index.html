const W = 864, H = 270, PITCH = 14, CELL = 11, LEFT = 55, TOP = 87, FLOOR = 186;
const COLORS = ['#161b22','#0e4429','#006d32','#26a641','#00c84d'];
const sourceDays = [
  [48,2,4],[48,3,6],[48,4,3],[48,6,2],[49,0,5],[49,3,4],[49,4,2],
  [49,5,3],[50,6,2],[52,0,12],[52,1,5],[52,2,14],[52,3,10]
];
const dense = new URLSearchParams(location.search).get('dense') === '1';
if (dense) {
  const occupied = new Set(sourceDays.map(([col,row]) => col + ':' + row));
  for (let col=0; col<53; col++) for (let row=0; row<7; row++) {
    if ((col*13+row*7)%9 < 5 && !occupied.has(col + ':' + row)) {
      sourceDays.push([col, row, (col*11+row*3)%14+1]);
    }
  }
}
const days = sourceDays.map(([col,row,count,level]) => ({
  col,row,count,x:LEFT+col*PITCH+5,y:TOP+row*PITCH+5,
  color:COLORS[level ?? Math.min(4,Math.ceil(count/3))]
}));
const captureMode = new URLSearchParams(location.search).get('capture') === '1';
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const uiPause = document.getElementById('pause');
const uiReplay = document.getElementById('replay');
const clamp = n => Math.max(0,Math.min(1,n));
const mix = (a,b,p) => a+(b-a)*clamp(p);
const smooth = p => { p=clamp(p); return p*p*(3-2*p); };
const palette = ['#ffe9a6','#ffad40','#e56725','#865549'];
const hitCount = count => count <= 2 ? 1 : count <= 5 ? 2 : count <= 9 ? 3 : 5;
const random = i => ((Math.imul(i+41,15731) ^ Math.imul(i+9,789221)) >>> 0) / 4294967296;
let art, backdrop, run, previous, elapsed=0, last=null, paused=false;

function pickEncounter() {
  const options = days.length >= 65 ? ['cluster','cluster','cluster','cat','empty'] : ['cat','cluster','empty'];
  let lastEncounter = previous;
  try { lastEncounter ??= sessionStorage.getItem('last-grid-encounter'); } catch {}
  const alternatives = options.filter(scene => scene !== lastEncounter);
  const choices = days.length >= 65 && Math.random() < .74 ? options : alternatives;
  const picked = choices[Math.floor(Math.random()*choices.length)];
  previous = picked;
  try { sessionStorage.setItem('last-grid-encounter',picked); } catch {}
  return picked;
}

function buildRun(encounter) {
  const blastRange = encounter === 'cluster' && days.length >= 65 ? 4 : 2.5;
  const edge = [...days].filter(day => day.col >= 10 && day.row >= 4)
    .sort((a,b) => b.col-a.col || b.row-a.row)[0];
  const blastCol = encounter === 'empty'
    ? Array.from({length:48},(_,i)=>i+8).filter(col => days.every(day =>
      Math.hypot(day.col-col,day.row-6)>blastRange))
      .sort((a,b)=>Math.abs(a-42)-Math.abs(b-42))[0] ?? 55
    : edge?.col ?? 48;
  const blastX = Math.min(833,LEFT+blastCol*PITCH+5);
  const stop = blastX-PITCH*4;
  const result = new Map();
  const blastAt = 7.45;
  if (encounter === 'cluster') {
    for (const day of days) {
      if (Math.hypot(day.col-blastCol,day.row-6) <= blastRange) result.set(day,blastAt);
    }
  }
  const remaining = days.filter(day => !result.has(day));
  const mining = [];
  let x=stop, time=encounter==='cat' ? 7.2 : 8.15;
  while (remaining.length) {
    let best=0;
    for(let i=1;i<remaining.length;i++){
      const score = day => Math.abs(day.x-x) + (6-day.row)*5;
      if (score(remaining[i]) < score(remaining[best])) best=i;
    }
    const [day] = remaining.splice(best,1);
    const facing = day.x >= x ? 1 : -1;
    const stand = Math.max(35,Math.min(828,day.x-facing*(art.hero.width/2+6)));
    const approach = Math.abs(stand-x)/150;
    const mineStart = time+approach+.1;
    const hits = hitCount(day.count), interval=.40;
    const brokenAt = mineStart+(hits-1)*interval+.27;
    const end = mineStart+hits*interval+.13;
    mining.push({start:time,from:x,stand,approach,mineStart,hits,interval,brokenAt,end,day,facing});
    result.set(day,brokenAt);
    x=stand;
    time=end;
  }
  return {encounter,blastX,blastAt,stop,result,mining,done:time};
}

function pixel(image,x,y,flip=false) {
  if (flip) {
    ctx.save();
    ctx.translate(Math.round(x)+image.width,Math.round(y));
    ctx.scale(-1,1);
    ctx.drawImage(image,0,0);
    ctx.restore();
  } else ctx.drawImage(image,Math.round(x),Math.round(y));
}

function sprite(image,middle,foot,flip=false) {
  pixel(image,middle-image.width/2,foot-image.height,flip);
}

function pose(frames,t,rate) {
  return frames[Math.floor(Math.max(0,t)*rate)%frames.length];
}

function board() {
  const image=document.createElement('canvas');
  image.width=W;
  image.height=H;
  const g=image.getContext('2d');
  g.imageSmoothingEnabled=false;
  g.fillStyle='#0d1117';
  g.fillRect(0,0,W,H);
  g.strokeStyle='#3b4149';
  g.beginPath(); g.roundRect(15.5,4.5,833,250,7); g.stroke();
  g.fillStyle='#e6edf3';
  g.font='18px system-ui';
  g.fillText('Contribution grid',38,32);
  g.fillStyle='#30363d';
  g.fillRect(38,41,W-77,1);
  g.save();
  g.beginPath(); g.roundRect(16,5,832,249,6); g.clip();
  const size=PITCH*2;
  for(let row=0;row<3;row++) for(let col=-2;col<30;col++){
    const x=LEFT+col*size, y=FLOOR+row*size;
    const tile=row===0?art.grass:random(col+5+row*33)>.72?art.brown:art.dirt;
    g.drawImage(tile,x,y,size,size);
  }
  g.restore();
  return image;
}

function grid(t, step) {
  for(let col=0;col<53;col++) for(let row=0;row<7;row++){
    ctx.fillStyle=COLORS[0];
    ctx.beginPath();
    ctx.roundRect(LEFT+col*PITCH,TOP+row*PITCH,CELL,CELL,1.5);
    ctx.fill();
  }
  for(const day of days){
    const age=t-run.result.get(day);
    if(age < 0 || Number.isNaN(age)){
      ctx.fillStyle=day.color;
      ctx.beginPath(); ctx.roundRect(day.x-5,day.y-5,CELL,CELL,1.5); ctx.fill();
    } else if (age<.40) {
      debris(day.x,day.y,age,day.color,8);
    }
  }
  if (!step || t<step.mineStart || t>=step.brokenAt) return;
  const {day, hits, interval}=step;
  const strength=clamp((t-step.mineStart+.15)/(hits*interval));
  ctx.strokeStyle='#c4f9aa';
  ctx.strokeRect(day.x-5.5,day.y-5.5,CELL,CELL);
  const crack=art.cracks[Math.min(3,Math.floor(strength*4))];
  if (strength>.24) pixel(crack,day.x-5,day.y-5);
}

function debris(x,y,age,color,count) {
  for(let i=0;i<count;i++){
    const a=i*2.39996, v=24+i*5;
    const px=x+Math.cos(a)*age*v, py=y+Math.sin(a)*age*v+age*age*55;
    if(py>=FLOOR) continue;
    ctx.fillStyle=i%3 ? color : '#c2ebb2';
    ctx.globalAlpha=1-clamp(age/.45);
    ctx.fillRect(Math.round(px),Math.round(py),2,2);
  }
  ctx.globalAlpha=1;
}

function strike(hero,foot,facing,phase,target) {
  // Pivot around the handle grip so the pickaxe travels with Havi's hand.
  const reach=smooth((phase-.10)/.16)*(1-smooth((phase-.27)/.13));
  const handX=hero+facing*mix(-12,11,reach);
  const handY=foot-11-4*reach;
  const dir=Math.atan2(target.y-handY,Math.abs(target.x-handX));
  const angle=mix(-.75,dir+1.12,reach);
  ctx.save();
  ctx.translate(Math.round(handX),Math.round(handY));
  ctx.scale(facing,1);
  ctx.rotate(angle);
  ctx.drawImage(art.pick,-7,-24);
  ctx.restore();
  const grip=art.hand;
  pixel(grip,handX-grip.width/2,handY-grip.height/2,facing<0);
}

function fireball(x,y,t) {
  ctx.save();
  ctx.translate(Math.round(x),Math.round(y));
  ctx.rotate(t*8);
  for(let i=0;i<4;i++){
    ctx.fillStyle=palette[3-i];
    const r=5-i;
    ctx.fillRect(-r,-r,2*r,2*r);
  }
  ctx.restore();
}

function explosion(x,age,size=1) {
  if(age<0 || age>=.50) return;
  const image=art.burst[Math.min(art.burst.length-1,Math.floor(age/.50*art.burst.length))];
  const width=Math.round(image.width*size), height=Math.round(image.height*size);
  ctx.drawImage(image,Math.round(x-width/2),FLOOR-height,width,height);
}

function ghastling(x,foot,t,aim) {
  const image=pose(art.ghast,t,20);
  sprite(image,x,foot);
  if (!aim) return;
  // Change only the face on the original ghastling head.
  const left=Math.round(x-image.width/2), top=Math.round(foot-image.height);
  ctx.fillStyle='#d5d4cf';
  ctx.fillRect(left+22,top+7,15,15);
  ctx.fillStyle='#514747';
  ctx.fillRect(left+24,top+10,3,3);
  ctx.fillRect(left+33,top+10,3,3);
  ctx.fillRect(left+28,top+16,5,6);
  ctx.fillStyle='#be4834';
  ctx.fillRect(left+25,top+12,2,1);
  ctx.fillRect(left+33,top+12,2,1);
  ctx.fillRect(left+29,top+19,3,2);
}

function render(t) {
  ctx.drawImage(backdrop,0,0);
  const step=run.mining.find(s=>t>=s.start && t<s.end);
  const finished=t>=run.done;
  grid(t, step);
  ctx.save();
  ctx.beginPath();
  ctx.rect(16,43,832,FLOOR-42);
  ctx.clip();
  const introEnd=6.35, fireAt=3.73, hitAt=4.14;
  let hero=mix(-30,run.stop,t/introEnd), facing=1, foot=FLOOR;
  let moving=t<introEnd, phase=null;
  if(step){
    hero=mix(step.from,step.stand,step.approach ? (t-step.start)/step.approach : 1);
    moving=t<step.start+step.approach;
    facing=moving?Math.sign(step.stand-step.from):step.facing;
    if(t>=step.mineStart && t<step.brokenAt+.10){
      phase=(t-step.mineStart)%step.interval;
      const rise=Math.max(0,FLOOR-23-step.day.y);
      foot-=rise*Math.sin(Math.PI*clamp(phase/step.interval));
    }
  } else if(finished && run.mining.length) {
    const end=run.mining.at(-1);
    hero=end.stand; facing=end.facing;
  }
  if(moving) foot-=Math.abs(Math.sin(t*25))*2;
  const tookHit=run.encounter!=='cat' && t>=run.blastAt && t<run.blastAt+.44;
  if(tookHit) foot-=Math.sin(Math.PI*(t-run.blastAt)/.44)*4;

  const jockeyEntry=1.75;
  const jockeyEnd=Math.min(768,Math.max(470,run.stop+40));
  const jockey=mix(885,jockeyEnd,(t-jockeyEntry)/(hitAt-jockeyEntry));
  const baseGhastX=hero-66;
  const ghastX=t<5.2 ? baseGhastX+112*smooth((t-2.75)/.85)*(1-smooth((t-hitAt)/1.02))
    : hero-61+34*Math.sin((t-5.2)*1.6);
  const ghastY=FLOOR-44+3*Math.sin(t*5.4);

  if(t>=jockeyEntry && t<hitAt) sprite(pose(art.jockey,t,20),jockey,FLOOR);
  if(t>=fireAt && t<hitAt) {
    const p=(t-fireAt)/(hitAt-fireAt);
    fireball(mix(ghastX+17,jockey,p),mix(ghastY-20,FLOOR-24,p),t);
  }
  explosion(jockeyEnd,t-hitAt,.72);

  const creeperEntry=2.75, fuseAt=6.73, fright=6.01;
  const creeperAt=t=>mix(881,run.blastX,(t-creeperEntry)/(fuseAt-creeperEntry));
  if(run.encounter==='cat' && t>=fright){
    const start=creeperAt(fright);
    const turn=t<fright+.13;
    const x=mix(start,885,(t-fright-.13)/1.1);
    if(x<881) sprite(pose(art.creeper,t,turn?0:22),x,FLOOR,turn);
  } else if(t>=creeperEntry && t<run.blastAt){
    const x=creeperAt(t);
    const fused=t>=fuseAt && x-hero<=4*PITCH+.01;
    sprite(fused?pose(art.fuse,t-fuseAt,14):pose(art.creeper,t,18),x,FLOOR,true);
  }
  if(run.encounter!=='cat') explosion(run.blastX,t-run.blastAt);

  let pet=hero-56, catPose='catStand', catDirection=1;
  if(t<5.44) catPose='catWalk';
  else if(run.encounter==='cat' && t<7.13){
    const p=t-5.44;
    pet=hero+mix(-56,56,smooth(p/.55));
    if(p>=.65){
      pet=hero+mix(56,-48,smooth((p-.65)/.96));
      catDirection=-1;
    }
    catPose='catWalk';
  } else if(t<8.3){
    pet=run.stop-49;
    catPose=run.encounter==='empty'?'catStand':'catLie';
  } else {
    const cycle=(t-8.3)%7;
    const catBase=Math.max(50,Math.min(735,run.stop-49));
    pet=catBase+14*smooth(cycle/.9)*(1-smooth((cycle-5.9)/1.1));
    catPose=cycle<.9||cycle>5.9?'catWalk':cycle<2.55?'catStand':'catLie';
    catDirection=cycle>5.9?-1:1;
  }
  const catBob=catPose==='catWalk'?Math.abs(Math.sin(t*20)):0;
  const catImage=catPose==='catWalk' && Math.floor(t*12)%4===0?art.catStand:art[catPose];
  sprite(catImage,pet,FLOOR-catBob,catDirection>0);
  const heroImage=tookHit && Math.floor((t-run.blastAt)*16)%2===0?art.heroHit:art.hero;
  if(moving && heroImage===art.hero){
    const flip=facing<0, x=hero-art.hero.width/2, y=foot-art.hero.height;
    pixel(art.heroBody,x,y,flip);
    const stride=Math.sin(t*23);
    pixel(art.heroFeet[0],x+(flip?art.hero.width-art.heroFeet[0].width:0),
      y+art.heroBody.height-Math.max(0,stride)*3,flip);
    pixel(art.heroFeet[1],x+(flip?0:art.heroFeet[0].width),
      y+art.heroBody.height-Math.max(0,-stride)*3,flip);
  } else sprite(heroImage,hero,foot,facing<0);
  if(phase!==null) strike(hero,foot,facing,phase,step.day);
  ghastling(ghastX,ghastY,t,t>=fireAt-.25 && t<=fireAt+.10);
  ctx.restore();
}

function loadImage(base64){
  return new Promise((resolve,reject)=>{
    const image=new Image();
    image.onload=()=>resolve(image);
    image.onerror=reject;
    image.src='data:image/png;base64,'+base64;
  });
}

function restart(){
  run=buildRun(pickEncounter());
  elapsed=0;
  paused=false;
  uiPause.textContent='Pause';
  render(0);
}

function tick(timestamp){
  if(last===null)last=timestamp;
  if(!paused) {
    elapsed+=Math.min(.05,(timestamp-last)/1000);
    render(elapsed);
  }
  last=timestamp;
  requestAnimationFrame(tick);
}

async function boot(){
  const loaded=await Promise.all(Object.entries(embedded).map(async ([key,value])=>[
    key,Array.isArray(value)?await Promise.all(value.map(loadImage)):await loadImage(value)
  ]));
  art=Object.fromEntries(loaded);
  backdrop=board();
  if (captureMode) {
    window.gridCapture = {
      start(scenario) {
        run = buildRun(scenario === 'auto' ? pickEncounter() : scenario);
        return { duration: run.done + 1.35, encounter: run.encounter, cells: days.length };
      },
      frame(time) {
        render(time);
        return canvas.toDataURL('image/png').split(',')[1];
      }
    };
    return;
  }
  restart();
  uiPause.onclick=()=>{
    paused=!paused;
    uiPause.textContent=paused?'Resume':'Pause';
  };
  uiReplay.onclick=restart;
  requestAnimationFrame(tick);
}
boot().catch(error=>{
  console.error(error);
  document.getElementById('error').hidden=false;
});
</script>
</html>
